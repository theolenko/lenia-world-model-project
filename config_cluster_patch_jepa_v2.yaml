# Cluster config — Patch-level JEPA (ViT encoder, pool=False) on v2 data
#
# Architecture: ViTEncoder(pool=False) produces (B, 64, D) patch embeddings.
# PatchPredictor maps patch embeddings of frame_t → predicted patches of frame_t+1.
# EMA target encoder same as JEPA-CNN. VICReg applied on flattened patches.
#
# Key differences from JEPA-CNN:
#   encoder: ViT(pool=False) — preserves spatial structure (64 patches)
#   predictor: PatchPredictor — same MLP applied per patch
#   loss: MSE over (B, 64, D) patch embeddings (not flat B, D)
#   VICReg: flattens (B, 64, D) → (B*64, D) before variance/covariance

data:
  train_path: data/v2_lenia_train_chunked.h5
  val_path:   data/v2_lenia_val_chunked.h5
  batch_size: 16
  num_workers: 8

model:
  embed_dim: 128                             # HPO best: trial #6, val_loss=0.01794
  ema_momentum: 0.9919                       # HPO best
  predictor_hidden_dim: 256                  # HPO best

training:
  num_epochs: 100
  early_stopping_patience: 15
  learning_rate: 1.523e-4                    # HPO best
  weight_decay: 4.598e-4                     # HPO best
  use_lr_schedule: true
  log_interval: 50
  checkpoint_interval: 10

jepa:
  use_variance_reg: true
  use_covariance_reg: true
  var_reg_weight: 0.3769                     # HPO best
  cov_reg_weight: 0.001995                   # HPO best

hpo:
  n_trials: 10
  hpo_epochs: 10
  study_name: null
  storage: null
  direction: minimize
  pruner: median

  search_space:
    embed_dim: [64, 128, 256]              # all divisible by num_heads=8
    learning_rate: [1.0e-5, 1.0e-3]       # ViT range
    weight_decay: [1.0e-5, 1.0e-2]
    batch_size: [16, 32]
    ema_momentum: [0.990, 0.999]
    predictor_hidden_dim: [256, 512]
    var_reg_weight: [0.01, 0.5]
    cov_reg_weight: [1.0e-3, 0.1]
