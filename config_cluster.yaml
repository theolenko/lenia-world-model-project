data:
  train_path: data/lenia_train_chunked.h5
  val_path: data/lenia_val_chunked.h5
  batch_size: 64
  num_workers: 8

model:
  embed_dim: 128
  ema_momentum: 0.99
  predictor_hidden_dim: 256

training:
  num_epochs: 100
  learning_rate: 1.0e-3
  weight_decay: 0.0
  device: cuda
  log_interval: 50
  checkpoint_interval: 10

jepa:
  use_variance_reg: false
  use_covariance_reg: false
  var_reg_weight: 1.0
  cov_reg_weight: 0.04

hpo:
  n_trials: 50
  hpo_epochs: 20
  study_name: null
  storage: null
  direction: minimize
  pruner: median

  search_space:
    embed_dim: [64, 128, 256]
    learning_rate: [1.0e-4, 1.0e-2]
    weight_decay: [1.0e-6, 1.0e-2]
    batch_size: [32, 64, 128]
    ema_momentum: [0.90, 0.999]
    predictor_hidden_dim: [128, 256, 512]
    var_reg_weight: [0.1, 10.0]
    cov_reg_weight: [1.0e-3, 0.1]
